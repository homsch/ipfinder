<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ipfinder - page not found</title>
    <style>
      :root {
        color-scheme: light dark;
        --text: #6b6375;
        --text-h: #08060d;
        --bg: #fff;
        font: 18px/145% system-ui, 'Segoe UI', Roboto, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #9ca3af;
          --text-h: #f3f4f6;
          --bg: #16171d;
        }
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      h1 {
        color: var(--text-h);
        font-weight: 500;
        margin: 0 0 8px;
      }
      a {
        color: var(--text-h);
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>This page does not exist.</p>
    <p><a href="/">Show my IP address</a></p>
  </body>
</html>
